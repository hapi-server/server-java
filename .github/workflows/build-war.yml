name: Build WAR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Install Tomcat 9
        run: |
          TOMCAT_VERSION=9.0.123

          echo "Downloading Tomcat..."
          curl -fL \
            --connect-timeout 15 \
            --max-time 90 \
            --retry 2 \
            "https://dlcdn.apache.org/tomcat/tomcat-9/v${TOMCAT_VERSION}/bin/apache-tomcat-${TOMCAT_VERSION}.tar.gz" \
            -o tomcat.tar.gz

          echo "Extracting Tomcat..."
          mkdir -p "$HOME/tomcat"
          tar -xzf tomcat.tar.gz -C "$HOME/tomcat" \
            --strip-components=1

          echo "Tomcat ready."

      - name: Install Tomcat 9
        run: |
          echo "Starting Tomcat download..."
          curl -fL \
            --connect-timeout 15 \
            --max-time 120 \
            --progress-bar \
            https://archive.apache.org/dist/tomcat/tomcat-9/v9.0.123/bin/apache-tomcat-9.0.123.tar.gz \
            -o tomcat.tar.gz

          echo "Download complete:"
          ls -lh tomcat.tar.gz

          echo "Extracting Tomcat..."
          mkdir -p "$HOME/tomcat"
          tar -xzf tomcat.tar.gz -C "$HOME/tomcat" \
            --strip-components=1

          echo "Tomcat installation complete."
            
      - name: Build WAR
        working-directory: HapiServer
        run: |
          ant \
            -Dplatforms.JDK_8__System_.home="$JAVA_HOME" \
            -Dj2ee.server.home="$HOME/tomcat" \
            dist

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: web-application
          path: HapiServer/dist/*.war
          if-no-files-found: error
